name: Build GTNH 2.9 RC2 preview JAR

on:
  push:
    branches: [gtnh-2.9-rc2]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable JAR
        run: |
          chmod +x gradlew
          ./gradlew assemble --no-daemon --stacktrace
      - name: Prepare named JAR
        run: |
          mkdir -p dist
          found=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$found"
          cp "$found" dist/CheaperVoidMiners-1.0.1-GTNH-2.9.0-RC2-Preview1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: CheaperVoidMiners-GTNH-2.9.0-RC2-Preview1
          path: dist/*.jar
          if-no-files-found: error
