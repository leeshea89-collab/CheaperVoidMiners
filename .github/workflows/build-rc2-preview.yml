name: Build GTNH 2.9 RC2 preview JAR

on:
  push:
    branches: [gtnh-2.9-rc2, single-upgradeable-miner, single-miner-id-isolation, single-miner-registration-probe, single-miner-native-void-probe, single-miner-lv-native-base, single-miner-affordable-lv]
  workflow_dispatch:

concurrency:
  group: rc2-preview-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable JAR
        run: |
          chmod +x gradlew
          ./gradlew assemble --no-daemon --stacktrace
      - name: Prepare named JAR
        run: |
          mkdir -p dist
          found=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$found"
          cp "$found" dist/CheaperVoidMiners-1.0.1-GTNH-2.9.0-RC2-SingleMiner-Affordable-LV-IV-Preview.jar
      - uses: actions/upload-artifact@v4
        with:
          name: CheaperVoidMiners-GTNH-2.9.0-RC2-SingleMiner-Affordable-LV-IV-Preview
          path: dist/*.jar
          if-no-files-found: error
      - name: Generate SHA-256 checksum
        if: github.ref == 'refs/heads/single-miner-affordable-lv'
        run: |
          cd dist
          sha256sum *.jar > SHA256SUMS.txt
      - name: Publish direct-JAR GitHub pre-release
        if: github.ref == 'refs/heads/single-miner-affordable-lv'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="affordable-lv-iv-preview-${GITHUB_SHA:0:7}"
          gh release create "$tag" dist/*.jar dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Affordable LV-IV Void Miner preview (${GITHUB_SHA:0:7})" \
            --notes "Unverified GTNH 2.9.0-RC2 testing build. LV Miner + 4 steel plates; compact steel multiblock. Keep VMTweak installed. Not yet tested in-game. Install only if you trust the repository and have backed up your world."
