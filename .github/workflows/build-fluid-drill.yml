name: Void Fluid Drill build

on:
  push:
    branches: [void-fluid-drill]
  workflow_dispatch:

concurrency:
  group: fluid-drill-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION must be MAJOR.MINOR.PATCH"; exit 1; }
          if gh release view "cheapervoidminers-v$v" >/dev/null 2>&1; then echo "Release cheapervoidminers-v$v exists: bump VERSION"; exit 1; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build the jar
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew assemble --no-daemon --stacktrace > build.log 2>&1 && break; echo "attempt $i failed"; tail -40 build.log; sleep 20; done
          tail -20 build.log
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -print -quit)"

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -nE "error:|warning: \[|FAILED|What went wrong" -A3 build.log > build-errors.log || true
          gh release create "cvm-log-${GITHUB_SHA:0:7}" build.log build-errors.log --target "$GITHUB_SHA" --prerelease --title "CVM build log ${GITHUB_SHA:0:7}" --notes "Build log." || true

      - name: Name and check the jar
        run: |
          mkdir -p dist
          found=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -print -quit)
          cp "$found" "dist/CheaperVoidMiners-$VERSION.jar"
          unzip -p "dist/CheaperVoidMiners-$VERSION.jar" mcmod.info | grep -q "$VERSION"
          unzip -l "dist/CheaperVoidMiners-$VERSION.jar" | grep -E "MTEVoidFluidDrill|PlanetFluids|FluidDrillHud|NEICvmConfig"

      - name: Boot a dev server
        id: boot
        continue-on-error: true
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt
          printf 'online-mode=false\nlevel-type=FLAT\nspawn-protection=0\n' > run/server/server.properties
          (timeout 1500 ./gradlew runServer --no-daemon > server.log 2>&1; echo "exit $?" >> server.log) &
          for i in $(seq 1 280); do
            sleep 5
            if grep -q 'Done (' server.log; then echo "server up"; break; fi
            if grep -qE '^exit |Encountered an unexpected exception|Exception in server tick loop' server.log; then echo "server stopped"; break; fi
          done
          sleep 5
          pkill -f 'GradleStart|net.minecraft.server|runServer' || true
          grep -E "CheaperVoidMiners" server.log > cvm.log || true
          cat cvm.log
          grep -q "Registered LV Void Fluid Drill" cvm.log
          grep -q "Void Fluid Drill planets with fluids" cvm.log
          grep -q "planet lock: MV T0-T2, HV T3-T4, EV T5-T6, IV T7-T8, LuV T9-T10" cvm.log

      - name: Publish server log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=""
          for f in server.log cvm.log; do [ -f "$f" ] && files="$files $f"; done
          [ -n "$files" ] && gh release create "cvm-log-${GITHUB_SHA:0:7}" $files --target "$GITHUB_SHA" --prerelease --title "CVM server log ${GITHUB_SHA:0:7}" --notes "Dev server boot log." || true

      - name: Publish the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "cheapervoidminers-v$VERSION" "dist/CheaperVoidMiners-$VERSION.jar" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Cheaper Void Miners $VERSION" \
            --notes "Adds the Void Fluid Drill (LV-IV): planet block in the controller picks the planet, a coloured lens in an input bus picks the fluid. Heads-up panel when looking at the controller or holding a planet block, NEI tab 'Void Fluid Drill'. Server boot test: ${{ steps.boot.outcome }}. Back up your world before use."
